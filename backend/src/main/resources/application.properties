spring.application.name=personal-finance-backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}
groq.api.key=${GROQ_API_KEY:}

# Cau hinh Gmail SMTP (uu tien dung khi chay local)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cau hinh Google Apps Script Webhook (uu tien dung tren Render Free)
mail.webhook.url=${MAIL_WEBHOOK_URL:}
mail.webhook.secret=${MAIL_WEBHOOK_SECRET:HTR_FINMIND_SECRET_2026}

# Cau hinh Google Login
app.google.client-id=${GOOGLE_CLIENT_ID:}